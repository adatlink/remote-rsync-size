[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-rsync-size"
version = "1.0.0"
description = "Measure multiple remote directory sizes using local rsync over SSH, and return JSON stats"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
keywords = ["rsync", "ssh", "directory", "size", "json", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]
dependencies = []

[project.optional-dependencies]
password = ["pexpect>=4.8"]
dev = ["pytest>=7.4", "pexpect>=4.8"]

[project.scripts]
remote-rsync-size = "remote_rsync_size.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
